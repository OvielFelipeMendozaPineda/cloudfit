ktor:
  deployment:
    port: "$PORT:8080"
    host: "0.0.0.0"
  application:
    modules:
      - com.masabi.cloudfit.ApplicationKt.module

cloudfit:
  s3:
    bucket: "$AWS_S3_BUCKET:"
    region: "$AWS_REGION:us-east-2"
  database:
    host: "$DB_HOST:"
    port: "$DB_PORT:3306"
    name: "$DB_NAME:cloudfit"
    user: "$DB_USER:"
    password: "$DB_PASSWORD:"
  removeBg:
    key: "$REMOVE_BG_API_KEY:"
  gemini:
    # Values come from env vars; the part after ':' is the default when the var is unset.
    apiKey: "$GEMINI_API_KEY:"
    baseUrl: "https://generativelanguage.googleapis.com/v1beta"
    stylistModel: "$CLOUDFIT_STYLIST_MODEL:gemini-3.6-flash"
    taggerModel: "$CLOUDFIT_TAGGER_MODEL:gemini-3.6-flash"
    imageModel: "$CLOUDFIT_IMAGE_MODEL:gemini-3.1-flash-image"
